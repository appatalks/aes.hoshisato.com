<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AES 128 / 256</title>
	<meta name="description" content="Browser-based AES-GCM encryption and decryption. All operations are local — nothing is sent to a server.">
	<link rel="stylesheet" href="code/style.css">
</head>
<body>
	<header>
		<div class="header-inner">
			<a href="/" class="logo-link" aria-label="Home">
				<img src="files/logo.png" alt="" width="52" height="52">
			</a>
			<span class="site-title">AES 128 / 256</span>
		</div>
	</header>

	<main>
		<div class="card">
			<div class="field">
				<label for="InputText">Plaintext / Ciphertext</label>
				<textarea id="InputText" rows="8" spellcheck="false" autocomplete="off" placeholder="Enter text to encrypt, or paste ciphertext to decrypt…"></textarea>
			</div>

			<div class="field-row">
				<div class="field">
					<label for="EncryptionKey">Password</label>
					<input id="EncryptionKey" type="password" autocomplete="off" placeholder="Enter password">
				</div>
				<div class="field field-narrow">
					<label for="Bit">Key size</label>
					<select id="Bit">
						<option value="128">128-bit</option>
						<option value="256" selected>256-bit</option>
					</select>
				</div>
			</div>

			<div class="actions">
				<button id="EncryptButton" type="button">Encrypt</button>
				<button id="DecryptButton" type="button">Decrypt</button>
			</div>

			<div id="ResultContainer" hidden>
				<div class="field">
					<label>Result</label>
					<pre id="OutputText"></pre>
				</div>
				<div class="actions">
					<button id="CopyButton" type="button">Copy to clipboard</button>
				</div>
			</div>
		</div>

		<p class="notice">All encryption and decryption is performed locally in your browser. Data is never sent to a server.</p>
	</main>

	<script src="code/crypto.js"></script>
	<script src="code/app.js"></script>
</body>
</html>
